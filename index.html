<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zakat-Rechner</title>
  <meta name="description" content="Berechnen Sie Ihre Zakat in wenigen Schritten." />
  <style>
    body { margin: 0; background: #eef3f1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .page { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
    .demo-note { max-width: 560px; margin: 0 auto 28px; text-align: center; color: #5a6b65; font-size: 13px; }
    .demo-note h1 { color: #16241f; font-size: 22px; margin: 0 0 6px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="demo-note">
      <h1>Zakat-Rechner</h1>
      <p>Vorschau / Test. In Webflow wird nur der Rechner unten eingebettet.</p>
    </div>

    <!-- This is exactly the snippet that gets embedded in Webflow -->
    <div data-zakat-rechner
         data-gold-price="95.00"
         data-silver-price="2.10"
         data-accent="#0e7c66"
         data-donate-url="#spenden"></div>
    <script src="./zakat-rechner.js" defer></script>
  </div>
</body>
</html>
