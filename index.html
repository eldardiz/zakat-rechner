<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human Relief — Widgets (Vorschau / Test)</title>
  <meta name="description" content="Vorschau der eingebetteten Widgets: Zakat-Rechner und Schnell-Spenden." />
  <style>
    body { margin: 0; background: #eef3f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .page { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
    .demo-note { max-width: 560px; margin: 0 auto 22px; text-align: center; color: #5a6675; font-size: 13px; }
    .demo-note h1 { color: #16232e; font-size: 22px; margin: 0 0 6px; }
    .demo-note h2 { color: #317FC2; font-size: 15px; margin: 40px 0 14px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="demo-note">
      <h1>Human Relief — Widgets</h1>
      <p>Vorschau / Test. In Webflow wird jeweils nur das Widget eingebettet. Die Spenden-Buttons f&uuml;hren zum echten Spendenformular.</p>
    </div>

    <div class="demo-note"><h2>Schnell-Spenden (Startseite)</h2></div>
    <!-- Embedded in Webflow on the homepage -->
    <div data-quick-donate
         data-accent="#317FC2"
         data-base="https://humanrelief.webflow.io/spendenformular"></div>
    <script src="./quick-donate.js" defer></script>

    <div class="demo-note"><h2>Zakat-Rechner (/zakat-rechner)</h2></div>
    <!-- Embedded in Webflow on the Zakat page -->
    <div data-zakat-rechner
         data-gold-price="125.00"
         data-silver-price="1.90"
         data-accent="#317FC2"
         data-donate-url="https://humanrelief.webflow.io/spendenformular?fb_item_id=88470"></div>
    <script src="./zakat-rechner.js" defer></script>
  </div>
</body>
</html>
